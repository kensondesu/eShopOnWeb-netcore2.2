# Resolved configuration for the agentic SDLC. Generated by Copier; safe to hand-edit.
#
# Precedence at runtime, lowest first:
#   .copier-answers.yml  <  this file  <  environment  <  explicit CLI overrides
#
# `copier update` will 3-way merge changes to this file, so local edits survive.

version: 1

# Where inference runs. `copilot` uses the models included in your Copilot subscription;
# `foundry` brings your own Azure OpenAI deployment.
llmProvider: copilot

models:
  # Writes specs and plans, and decomposes work.
  orchestrator: claude-opus-4.6
  # Writes the code. This is where the token spend goes.
  implementer: claude-sonnet-4.6
  # Reviews the agent's own diff before the PR is marked ready for review.
  reviewer: claude-sonnet-4.6
  reasoningEffort: high

github:
  owner: kensondesu
  repo: eShopOnWeb-netcore2.2
  # appId and installationId are supplied at runtime by actions/create-github-app-token.
  # Never use GITHUB_TOKEN to open agent pull requests: required status checks will not run and
  # the pull request stalls forever.

delivery:
  cloudTarget: none-localhost
  devEnvStrategy: localhost
  baseBranch: main
  # Must match the repository ruleset that permits agent writes.
  branchPrefix: feature/

telemetry:
  mode: file-only
  filePath: telemetry-out/copilot.otel.jsonl
  sourceName: agentic-sdlc
  # Prompts and completions land in AppGenAIContent. Make that a Protected table before enabling.
  captureContent: false

budget:
  maxCostPerFeatureUsd: 25.0
  maxTurns: 500
  # Copilot bills token usage as AI credits; the SDK reports AI units. The USD ceiling needs a rate.
  usdPerAiu: 0.01
  # Fallback for plans still on the premium-request billing retired on 2026-06-01.
  # It is an assumption (no verified GitHub price), which is why it is configurable and not a
  # constant — a wrong hardcoded rate silently changes what maxCostPerFeatureUsd means.
  usdPerPremiumRequest: 0.04

# QA promotion via a Teams Adaptive Card (a Custom Deployment Protection Rule). Production always
# uses GitHub's native Required Reviewers regardless of this setting.
teamsApprovals: false
